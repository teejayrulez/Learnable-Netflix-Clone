<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kim izliyor? — Netflix profilleri" />
    <link rel="stylesheet" href="../style.css" />
    <title>Profiller — Netflix</title>
  </head>
  <body class="profile-section">
    <header>
      <nav>
        <a href="../index.html" aria-label="Netflix ana sayfa">
          <img src="../image/Logo.png" alt="Netflix" />
        </a>
      </nav>
    </header>

    <main>
      <h1 class="profile-head">Kim izliyor?</h1>

      <ul class="profile-container">
        <li class="profile-card">
          <a href="../pages/home.html">
            <img src="../image/Murat.png" alt="Murat profili" />
            <p>Murat</p>
          </a>
        </li>
        <li class="profile-card">
          <a href="../pages/home.html">
            <img src="../image/Umut.png" alt="Umut profili" />
            <p>Umut</p>
          </a>
        </li>
        <li class="profile-card">
          <a href="../pages/home.html">
            <img src="../image/Kemal.png" alt="Kemal profili" />
            <p>Kemal</p>
          </a>
        </li>
        <li class="profile-card">
          <a href="../pages/home.html">
            <img src="../image/Cocuk.png" alt="Çocuk profili" />
            <p>Çocuk</p>
          </a>
        </li>
        <li class="profile-card add-card">
          <a href="#">
            <img class="add-profile" src="../image/Add.png" alt="Yeni profil ekle" />
            <p class="add-name">Profil Ekle</p>
          </a>
        </li>
      </ul>

      <div class="profile-btn">
        <a href="#">PROFİLLERİ YÖNET</a>
      </div>
    </main>
  </body>
</html>
